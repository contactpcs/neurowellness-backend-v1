[alembic]
# Path to migration scripts (relative to this file's directory)
script_location = migrations

# Add app/ to sys.path so env.py can import app.config
prepend_sys_path = .

# Version filename format: 001_description.py
file_template = %%(rev)s_%%(slug)s

# Use OS path separator for version files
version_path_separator = os

# sqlalchemy.url is intentionally empty here — env.py reads DATABASE_URL
# from the environment so the credential never lives in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
